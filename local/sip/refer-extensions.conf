[sip-proof](+)
exten => _bridge-.,1,Answer()
 same => n,CELGenUserEvent(PROOF_REFER_SOURCE,${PJSIP_HEADER(read,Call-ID)})
 same => n,Dial(Local/hold@refer-proof/n,10)
 same => n,Hangup()

exten => _media-.,1,Answer()
 same => n,CELGenUserEvent(PROOF_REFER_SOURCE,${PJSIP_HEADER(read,Call-ID)})
 same => n,Set(PROOF_REMOTE=${CHANNEL(pjsip,remote_addr)})
 same => n,Set(__PROOF_TARGET_HOST=${CUT(PROOF_REMOTE,:,1)})
 same => n,Dial(Local/echo@refer-proof/n,10)
 same => n,Hangup()

exten => _peer-.,1,CELGenUserEvent(PROOF_REFER_TARGET,${EXTEN})
 same => n,Wait(2)
 same => n,Dial(PJSIP/proof-client/sip:proof-target@${PROOF_TARGET_HOST}:${CUT(EXTEN,-,2)},5,b(refer-proof^peer^1))
 same => n,Hangup()

exten => _target-.,1,CELGenUserEvent(PROOF_REFER_TARGET,${EXTEN})
 same => n,Wait(2)
 same => n,Dial(Local/answer@refer-proof/n,5)
 same => n,Hangup()

exten => _failed-.,1,CELGenUserEvent(PROOF_REFER_TARGET,${EXTEN})
 same => n,Wait(2)
 same => n,Dial(Local/reject@refer-proof/n,5)
 same => n,Hangup()

exten => _timeout-.,1,CELGenUserEvent(PROOF_REFER_TARGET,${EXTEN})
 same => n,Wait(2)
 same => n,Dial(Local/noanswer@refer-proof/n,3)
 same => n,Hangup()

[refer-proof]
exten => peer,1,CELGenUserEvent(PROOF_REFER_PEER,${CHANNEL(pjsip,call-id)})
 same => n,Return()

exten => echo,1,Answer()
 same => n,Echo()
 same => n,Hangup()

exten => hold,1,Answer()
 same => n,PlayTones(440)
 same => n,Wait(10)
 same => n,Hangup()

exten => answer,1,Answer()
 same => n,PlayTones(660)
 same => n,Wait(2)
 same => n,Hangup()

exten => reject,1,Busy(1)
 same => n,Hangup()

exten => noanswer,1,Ringing()
 same => n,Wait(10)
 same => n,Hangup()
