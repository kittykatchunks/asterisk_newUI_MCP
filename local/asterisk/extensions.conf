[general]
static = yes
writeprotect = yes

[proof]
exten => tone,1,Answer()
 same => n,MixMonitor(/var/spool/asterisk/monitor/${UNIQUEID}.wav)
 same => n,PlayTones(440)
 same => n,Wait(2)
 same => n,StopPlayTones()
 same => n,StopMixMonitor()
 same => n,Hangup()

exten => queue,1,Answer()
 same => n,Queue(proof-queue,,,n,2)
 same => n,Hangup()

exten => sink,1,Answer()
 same => n,Wait(5)
 same => n,Hangup()
