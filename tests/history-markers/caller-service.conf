[history-caller-service]
exten => entry,1,Set(HISTORY_JOURNEY=${UUID()})
 same => n,Set(HISTORY_VISIT=${UUID()})
 same => n,CELGenUserEvent(HISTORY_ENTRY,{"v":1,"journeyId":"${HISTORY_JOURNEY}","entryKind":"synthetic","routeRevision":"caller-service-v1"})
 same => n,Answer()
 same => n,CELGenUserEvent(HISTORY_QUEUE_VISIT,{"v":1,"journeyId":"${HISTORY_JOURNEY}","visitId":"${HISTORY_VISIT}","queue":"caller-service-queue","routeRevision":"caller-service-v1"})
 same => n,Queue(caller-service-queue,,,n,10)
 same => n,Hangup()

[history-caller-service-member]
exten => answer,1,Answer()
 same => n,Wait(20)
 same => n,Hangup()
