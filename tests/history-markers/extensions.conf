[history-marker]
exten => entry,1,Set(HISTORY_JOURNEY=${UUID()})
 same => n,Set(HISTORY_VISIT=${UUID()})
 same => n,CELGenUserEvent(HISTORY_ENTRY,{"v":1,"journeyId":"${HISTORY_JOURNEY}","entryKind":"synthetic","routeRevision":"marker-v1"})
 same => n,Answer()
 same => n,CELGenUserEvent(HISTORY_QUEUE_VISIT,{"v":1,"journeyId":"${HISTORY_JOURNEY}","visitId":"${HISTORY_VISIT}","queue":"proof-queue","routeRevision":"marker-v1"})
 same => n,Queue(proof-queue,,,n,2)
 same => n,Hangup()
