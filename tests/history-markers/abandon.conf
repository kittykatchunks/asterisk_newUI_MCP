[history-abandon]
exten => entry,1,Set(HISTORY_JOURNEY=${UUID()})
 same => n,Set(HISTORY_VISIT=${UUID()})
 same => n,CELGenUserEvent(HISTORY_ENTRY,{"v":1,"journeyId":"${HISTORY_JOURNEY}","entryKind":"synthetic","routeRevision":"abandon-v1"})
 same => n,Answer()
 same => n,CELGenUserEvent(HISTORY_QUEUE_VISIT,{"v":1,"journeyId":"${HISTORY_JOURNEY}","visitId":"${HISTORY_VISIT}","queue":"abandon-queue","routeRevision":"abandon-v1"})
 same => n,Queue(abandon-queue,,,n,10)
 same => n,Hangup()
